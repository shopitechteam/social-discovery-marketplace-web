fragment StoryMediaFields on StoryMedia {
  mediaType
  imageUrl
  thumbnailUrl
  muxPlaybackId
  muxThumbnailUrl
  duration
  processingStatus
}

fragment StoryFields on Story {
  id
  caption
  expiresAt
  viewCount
  isViewed
  createdAt
  media {
    ...StoryMediaFields
  }
}

fragment StoryCreatorFields on User {
  id
  username
  profile {
    firstName
    lastName
    avatar
  }
}

fragment StoryRingFields on StoryRing {
  hasUnviewed
  totalCount
  user {
    ...StoryCreatorFields
  }
  stories {
    ...StoryFields
  }
}

query StoriesFeed {
  storiesFeed {
    ...StoryRingFields
  }
}

query StoryViewers($storyId: String!, $after: String) {
  storyViewers(storyId: $storyId, after: $after, limit: 30) {
    totalCount
    hasMore
    nextCursor
    viewers {
      viewedAt
      user {
        ...StoryCreatorFields
      }
    }
  }
}

mutation RequestStoryImageUpload($mimeType: String) {
  requestStoryImageUpload(mimeType: $mimeType) {
    uploadUrl
    tempKey
  }
}

mutation CreateStory($input: CreateStoryInput!) {
  createStory(input: $input) {
    id
  }
}

mutation SyncStory($storyId: String!) {
  syncStory(storyId: $storyId)
}

mutation RequestStoryVideoUpload($caption: String) {
  requestStoryVideoUpload(caption: $caption) {
    storyId
    uploadUrl
    uploadId
  }
}

mutation DeleteStory($storyId: String!) {
  deleteStory(storyId: $storyId)
}

mutation ViewStory($storyId: String!) {
  viewStory(storyId: $storyId)
}
