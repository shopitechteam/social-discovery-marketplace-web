<svg xmlns="http://www.w3.org/2000/svg" width="358" height="98.06" viewBox="0 -1.03 358 98.06" role="img" aria-label="shopi">
  <!--
    Shopi horizontal lockup: badge + wordmark, no ".co.ke" — the domain belongs
    in the footer and metadata, not in the mark.

    Wordmark is Poppins ExtraBold in outlines, so it needs no webfont at render
    time. Poppins is a geometric sans with circular bowls, the family the
    reference lockup's face belongs to; Manrope, which the app sets its UI in,
    is a grotesque and reads squarer and narrower at this weight.

    Proportions are taken from that reference (badge 70px, baseline 98, x-height
    37.5): x-height 0.536 of the badge's height and a gap of 0.200 of it. Tracking
    -0.0366 em is solved rather than guessed — the value at which Poppins sets
    "whatnot" to the reference's own width-to-x-height ratio of 7.387.

    The box is 98.1 tall against the badge's 96 because "shopi" has a descender
    and an i-dot where "whatnot" has neither, so at a matched x-height its ink
    is taller than the badge. The ink is centred on the badge and the viewBox
    crops to the union of the two, so nothing is clipped.
  -->
