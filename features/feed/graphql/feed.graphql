fragment MuxMetaFields on MuxVideoMeta {
  playbackId
  duration
  aspectRatio
  thumbnailUrl
  animatedThumbnailUrl
}

fragment R2VariantFields on R2ImageVariant {
  url
  variant
  width
  height
}

fragment MediaItemFields on MediaItem {
  mediaType
  url
  imageUrl
  thumbnailUrl
  sortOrder
  displayWidth
  displayHeight
  muxMeta {
    ...MuxMetaFields
  }
  r2Variants {
    ...R2VariantFields
  }
}

fragment ContentCardFields on Content {
  id
  slug
  type
  source
  isLive
  tiktokEmbed {
    videoId
    shareUrl
    coverImageUrl
    authorUsername
    authorName
    title
    duration
  }
  title
  caption
  hashtags
  creatorId
  allowDownload
  hdEnabled
  createdAt
  creator {
    id
    username
    isVerified
    isFollowedByMe
    followerCount
    profile {
      firstName
      lastName
      avatar
    }
  }
  media {
    ...MediaItemFields
  }
  price {
    amount
    currency
    negotiable
  }
  stats {
    views
    likes
    shares
    saves
    comments
  }
  location {
    county
    subregion
    placeName
    formattedAddress
  }
  ranking {
    rankScore
    trendingScore
  }
  isLikedByMe
  isSavedByMe
  isMyContent
}

query ForYouFeed($limit: Int, $after: String) {
  forYouFeed(limit: $limit, after: $after) {
    items {
      ...ContentCardFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query TrendingContent($county: String) {
  trendingContent(county: $county) {
    ...ContentCardFields
  }
}

query GetContent($id: String!) {
  content(id: $id) {
    ...ContentCardFields
  }
}

query FollowingFeed($limit: Int, $after: String) {
  followingFeed(limit: $limit, after: $after) {
    items {
      ...ContentCardFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query LocalFeed(
  $latitude: Float
  $longitude: Float
  $radiusKm: Float
  $county: String
  $subregion: String
  $limit: Int
  $after: String
) {
  localFeed(
    latitude: $latitude
    longitude: $longitude
    radiusKm: $radiusKm
    county: $county
    subregion: $subregion
    limit: $limit
    after: $after
  ) {
    items {
      ...ContentCardFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
