<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 96 96" role="img" aria-label="Shopi">
  <!--
    Shopi mark: a shopping bag whose body is an S.

    Redrawn as vector from the supplied artwork rather than traced, so it stays
    crisp at any size. The skeleton came off that file by distance transform, so
    these are its real proportions, normalised to a 96 tile: superellipse corner
    of exponent 3.45 (softer than the iOS ~5), glyph 61% of the tile wide and
    73% tall, S stroke 14.5 with the bowls' extremes at x 26.7 / 68.9, handle a
    semicircle of centreline radius 10.25 and stroke 5.5, and its pink #E20160.

    Cleaned up on the way in: the original's stroke ran 15.9 at the bowls and
    12.9 at the waist, which is one weight here; the waist moved from y 52.2 to
    53.5, because at the measured height the counter above it closed to 3 units
    and filled in at favicon sizes; and the glyph is centred on the tile, which
    it was not.
  -->
  <path fill="#E20160" d="M96 48C96 55.26 95.68 64.61 95.04 69.93C94.41 75.24 93.45 77.25 92.16 80.12C90.87 82.99 89.26 85.27 87.26 87.26C85.27 89.26 82.99 90.87 80.12 92.16C77.25 93.45 75.24 94.41 69.93 95.04C64.61 95.68 55.26 96 48 96C40.74 96 31.39 95.68 26.07 95.04C20.76 94.41 18.75 93.45 15.88 92.16C13.01 90.87 10.73 89.26 8.74 87.26C6.74 85.27 5.13 82.99 3.84 80.12C2.55 77.25 1.59 75.24 0.96 69.93C0.32 64.61 0 55.26 0 48C0 40.74 0.32 31.39 0.96 26.07C1.59 20.76 2.55 18.75 3.84 15.88C5.13 13.01 6.74 10.73 8.74 8.74C10.73 6.74 13.01 5.13 15.88 3.84C18.75 2.55 20.76 1.59 26.07 0.96C31.39 0.32 40.74 0 48 0C55.26 0 64.61 0.32 69.93 0.96C75.24 1.59 77.25 2.55 80.12 3.84C82.99 5.13 85.27 6.74 87.26 8.74C89.26 10.73 90.87 13.01 92.16 15.88C93.45 18.75 94.41 20.76 95.04 26.07C95.68 31.39 96 40.74 96 48Z"/>
  <!-- Bag handle, drawn first so its legs are buried under the S's top bar. -->
  <path fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"
        d="M37.75 31V26.5a10.25 10.25 0 0 1 20.5 0V31"/>
  <!-- The S. Flat horizontal terminals, bowls carried by curves, every join
       tangent-continuous so it reads as one sweep. -->
  <path fill="none" stroke="#FFFFFF" stroke-width="14.5" stroke-linecap="round" stroke-linejoin="round"
        d="M70 34.7H44C36 34.7 26.7 36.5 26.7 41C26.7 46 40 50 49.7 53.5C59.4 57 68.9 59 68.9 63.2C68.9 68 58 74.3 44 74.3H26"/>
</svg>
